name: Build Power Apps Solution ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-solution:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build PCF
        run: npm run build

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet for solution project
        run: nuget restore Solution/Solution.cdsproj

      - name: Build solution project (unmanaged zip)
        shell: pwsh
        run: |
          msbuild Solution/Solution.cdsproj /restore /t:Build /p:Configuration=Release

      - name: Find built solution zip
        id: findzip
        shell: pwsh
        run: |
          $zips = Get-ChildItem -Path Solution -Recurse -Filter *.zip | Select-Object -ExpandProperty FullName
          if (-not $zips) { throw "No solution zip found under Solution/" }
          $zip = $zips | Select-Object -First 1
          "zip_path=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "Found zip: $zip"

      - name: Upload solution artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerapps-solution-zip
          path: ${{ steps.findzip.outputs.zip_path }}
          if-no-files-found: error
